name: CI/CD

on:
  push:
    branches:
      - "*" # toutes les branches
  pull_request:
    branches:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v3

      - name: Construire les services Docker
        run: docker compose build
# petit test pour relancer le workflow
